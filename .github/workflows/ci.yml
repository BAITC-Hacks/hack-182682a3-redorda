name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: redorda_ci
          POSTGRES_USER: redorda
          # Disposable CI service; no password is stored in source control.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U redorda -d redorda_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://redorda@localhost:5432/redorda_ci
      REDIS_URL: redis://localhost:6379/0
      REDORDA_LIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.txt
      - run: ruff check backend packages scripts agent.py
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest -q
      - run: python backend/manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
      - run: diff docs/openapi.yaml /tmp/openapi.yaml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  deploy:
    needs: [backend, frontend, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Mac mini deployment
        env:
          WEBHOOK_SECRET: ${{ secrets.MACMINI_WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import urllib.request

          secret = os.environ['WEBHOOK_SECRET']
          if not secret:
              raise SystemExit('MACMINI_WEBHOOK_SECRET is not configured')
          repository = os.environ['REPOSITORY']
          body = json.dumps({
              'ref': 'refs/heads/main',
              'repository': {'name': repository.split('/')[-1], 'full_name': repository},
          }).encode()
          signature = hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
          request = urllib.request.Request(
              'https://hook.1ge.kz/github-webhook', data=body,
              headers={'Content-Type': 'application/json', 'X-GitHub-Event': 'push',
                       'X-Hub-Signature-256': 'sha256=' + signature},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = response.read().decode()
              if response.status != 202 or result != 'accepted':
                  raise SystemExit(f'Deploy rejected: {response.status} {result}')
              print('Mac mini accepted deployment; see logs/deploy.log for completion.')
          PY
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated local configuration
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          path = Path('.env')
          path.write_text(path.read_text().replace('POSTGRES_PASSWORD=',
                                                  'POSTGRES_PASSWORD=' + secrets.token_hex(24)))
          PY
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:5173/api/v1/ready/
      - run: docker compose logs --no-color --tail 100
        if: failure()
      - run: docker compose down --volumes
        if: always()
