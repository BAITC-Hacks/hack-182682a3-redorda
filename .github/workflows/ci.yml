name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.txt
      - run: ruff check backend packages scripts agent.py
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest -q
      - run: python backend/manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
      - run: diff docs/openapi.yaml /tmp/openapi.yaml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
