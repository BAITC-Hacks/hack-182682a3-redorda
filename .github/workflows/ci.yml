name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.txt
      - run: ruff check backend packages scripts agent.py
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest -q
      - run: python backend/manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
      - run: diff docs/openapi.yaml /tmp/openapi.yaml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Mac mini deployment
        env:
          WEBHOOK_SECRET: ${{ secrets.MACMINI_WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import urllib.request

          secret = os.environ['WEBHOOK_SECRET']
          if not secret:
              raise SystemExit('MACMINI_WEBHOOK_SECRET is not configured')
          repository = os.environ['REPOSITORY']
          body = json.dumps({
              'ref': 'refs/heads/main',
              'repository': {'name': repository.split('/')[-1], 'full_name': repository},
          }).encode()
          signature = hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
          request = urllib.request.Request(
              'https://hook.1ge.kz/github-webhook', data=body,
              headers={'Content-Type': 'application/json', 'X-GitHub-Event': 'push',
                       'X-Hub-Signature-256': 'sha256=' + signature},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = response.read().decode()
              if response.status != 202 or result != 'accepted':
                  raise SystemExit(f'Deploy rejected: {response.status} {result}')
              print('Mac mini accepted deployment; see logs/deploy.log for completion.')
          PY
