name: redorda
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redorda
      POSTGRES_USER: redorda
      POSTGRES_PASSWORD: redorda-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redorda"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://redorda:redorda-local@db:5432/redorda
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "python backend/manage.py migrate && python backend/manage.py runserver 0.0.0.0:8000 --noreload"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/participant-kit:/workspace/data/participant-kit:ro
      - ./artifacts:/workspace/artifacts
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 15
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://redorda:redorda-local@db:5432/redorda
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "--workdir", "backend", "-A", "config", "worker", "--loglevel=info", "--concurrency=1"]
    volumes:
      - ./data/participant-kit:/workspace/data/participant-kit:ro
      - ./artifacts:/workspace/artifacts
    depends_on:
      backend: { condition: service_healthy }
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend: { condition: service_healthy }
volumes:
  postgres_data:
