name: redorda
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment: &backend-environment
    DATABASE_URL: postgresql://redorda:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/redorda
    REDIS_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
  volumes:
    - ./data/participant-kit:/workspace/data/participant-kit:ro
    - django_static:/workspace/backend/staticfiles
    - dataset_media:/workspace/backend/media
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: redorda
      POSTGRES_USER: redorda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redorda -d redorda"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    <<: *backend
    command: ["sh", "-c", "python backend/manage.py migrate --noinput && python backend/manage.py collectstatic --noinput"]
    depends_on:
      db: { condition: service_healthy }
  backend:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready/', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 15
  worker:
    <<: *backend
    command: ["celery", "--workdir", "backend", "-A", "config", "worker", "--loglevel=info", "--pool=prefork", "--concurrency=1", "--hostname=worker@%h"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery --workdir backend -A config inspect ping --destination worker@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    volumes:
      - django_static:/usr/share/nginx/html/django-static:ro
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  django_static:
  dataset_media:
