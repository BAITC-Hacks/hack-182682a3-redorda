  /api/v1/runs/{id}/commands/:
    post:
      operationId: v1_runs_commands_create
      description: Команда по сохранённому snapshot. create_plan создаёт черновик
        с новым бюджетом; explain/compare требуют функций AI-движка. Доступность —
        в team.available_commands. allowed_channels пока не поддерживается движком.
        После 202 опрашивайте GET команды.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Ключ длиной 1–255 символов.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - team
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCommandRequest'
            examples:
              НовыйПлан:
                value:
                  type: create_plan
                  snapshot_id: 00000000-0000-0000-0000-000000000002
                  parameters:
                    name: Меньший бюджет
                    constraints:
                      budget: '50000.00'
                summary: Новый план
              Объяснение(послеПодключенияAI):
                value:
                  type: explain
                  snapshot_id: 00000000-0000-0000-0000-000000000002
                  parameters:
                    campaign_id: '1'
                summary: Объяснение (после подключения AI)
              Сравнение(послеПодключенияAI):
                value:
                  type: compare
                  snapshot_id: 00000000-0000-0000-0000-000000000002
                  parameters:
                    constraints:
                      budget: '50000.00'
                summary: Сравнение (после подключения AI)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeamCommandRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeamCommandRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCommandResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
