  /api/v1/datasets/import/:
    post:
      operationId: v1_datasets_import_create
      description: 'Import exactly dict_tariff.csv, traffic.csv, arpu_monthly.csv
        and change_tariff.csv using the repeated multipart files field. Limits: 30
        MiB per file and 50 MiB total. Existing identical bytes reactivate the dataset
        and preserve its original source metadata.'
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DatasetUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
