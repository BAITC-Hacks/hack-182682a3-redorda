openapi: 3.0.3
info:
  title: RedOrda Campaign API
  version: 1.0.0
paths:
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Токен из auth/csrf/; после login использовать новый.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Токен из auth/csrf/; после login использовать новый.
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/datasets/current/:
    get:
      operationId: v1_datasets_current_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/meta/:
    get:
      operationId: v1_meta_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
          description: ''
  /api/v1/ready/:
    get:
      operationId: v1_ready_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: ''
  /api/v1/runs/:
    get:
      operationId: v1_runs_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRunList'
          description: ''
    post:
      operationId: v1_runs_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Run'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Run'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Run'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
  /api/v1/runs/{id}/:
    get:
      operationId: v1_runs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
  /api/v1/runs/{id}/cancel/:
    post:
      operationId: v1_runs_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/runs/{id}/events/:
    get:
      operationId: v1_runs_events_retrieve
      parameters:
      - in: query
        name: after
        schema:
          type: integer
        description: ID последнего полученного события; от 0.
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      - in: query
        name: limit
        schema:
          type: integer
        description: Размер страницы от 1 до 200.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/runs/{id}/export/:
    get:
      operationId: v1_runs_export_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/runs/{id}/results/:
    get:
      operationId: v1_runs_results_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/runs/{id}/start/:
    post:
      operationId: v1_runs_start_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Стабильный ключ запроса запуска, максимум 255 символов.
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    CampaignResult:
      type: object
      properties:
        rank:
          type: integer
        parameters:
          type: object
          additionalProperties: {}
        explanation:
          type: string
          nullable: true
        metrics:
          type: object
          additionalProperties: {}
      required:
      - explanation
      - metrics
      - parameters
      - rank
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Dataset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        checksum:
          type: string
          maxLength: 64
        customer_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        summary: {}
        imported_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - checksum
      - customer_count
      - id
      - imported_at
      - name
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties: {}
      required:
      - code
      - fields
      - message
    Health:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
      required:
      - service
      - status
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 512
      required:
      - password
      - username
    Meta:
      type: object
      properties:
        limits:
          type: object
          additionalProperties:
            type: integer
        channel_costs:
          type: object
          additionalProperties:
            type: integer
        features:
          $ref: '#/components/schemas/MetaFeatures'
      required:
      - channel_costs
      - features
      - limits
    MetaFeatures:
      type: object
      properties:
        run_execution:
          type: boolean
        openai_strategy:
          type: boolean
        csv_export:
          type: boolean
      required:
      - csv_export
      - openai_strategy
      - run_execution
    PaginatedRunList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Run'
    Readiness:
      type: object
      properties:
        status:
          type: string
        database:
          type: boolean
        broker:
          type: boolean
      required:
      - broker
      - database
      - status
    ResultTotals:
      type: object
      properties:
        pilot_cost:
          type: string
        campaign_cost:
          type: string
          nullable: true
        total_cost:
          type: string
          nullable: true
        pilot_contacts:
          type: integer
        total_contacts:
          type: integer
          nullable: true
        predicted_effect:
          nullable: true
        simulator_result:
          nullable: true
      required:
      - campaign_cost
      - pilot_contacts
      - pilot_cost
      - predicted_effect
      - simulator_result
      - total_contacts
      - total_cost
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        dataset_id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RunStatusEnum'
          readOnly: true
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '100000.00'
        max_contacts:
          type: integer
          maximum: 15000
          minimum: 1
          default: 15000
        max_pilots:
          type: integer
          maximum: 20
          minimum: 1
          default: 20
        seed:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 42
        strategy:
          allOf:
          - $ref: '#/components/schemas/StrategyEnum'
          default: baseline
        created_at:
          type: string
          format: date-time
          readOnly: true
        progress:
          allOf:
          - $ref: '#/components/schemas/RunProgress'
          readOnly: true
        error:
          allOf:
          - $ref: '#/components/schemas/RunFailure'
          nullable: true
          readOnly: true
        cancellation_requested:
          type: boolean
          readOnly: true
      required:
      - cancellation_requested
      - created_at
      - dataset_id
      - error
      - id
      - name
      - progress
      - status
    RunEvent:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        payload: {}
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - id
      - kind
      - payload
    RunEventPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        next_after:
          type: integer
        has_more:
          type: boolean
      required:
      - has_more
      - next_after
      - results
    RunFailure:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    RunProgress:
      type: object
      properties:
        stage:
          type: string
        percent:
          type: integer
          maximum: 100
          minimum: 0
        spent_budget:
          type: string
          nullable: true
        used_contacts:
          type: integer
          nullable: true
        completed_pilots:
          type: integer
      required:
      - completed_pilots
      - percent
      - spent_budget
      - stage
      - used_contacts
    RunResult:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunResultStatusEnum'
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/CampaignResult'
        totals:
          $ref: '#/components/schemas/ResultTotals'
        warnings:
          type: array
          items:
            type: string
      required:
      - campaigns
      - run_id
      - status
      - totals
      - warnings
    RunResultStatusEnum:
      enum:
      - completed
      type: string
      description: '* `completed` - completed'
    RunStatusEnum:
      enum:
      - draft
      - queued
      - running
      - completed
      - failed
      - cancelled
      type: string
      description: |-
        * `draft` - Черновик
        * `queued` - В очереди
        * `running` - Выполняется
        * `completed` - Завершён
        * `failed` - Ошибка
        * `cancelled` - Отменён
    Session:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          nullable: true
        csrf_token:
          type: string
      required:
      - authenticated
      - user
    StrategyEnum:
      enum:
      - baseline
      - openai
      type: string
      description: |-
        * `baseline` - baseline
        * `openai` - openai
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        is_staff:
          type: boolean
      required:
      - id
      - is_staff
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
