components:
  schemas:
    ActorIdEnum:
      enum:
      - lead
      - analyst
      - experiment
      - finance
      - control
      type: string
      description: |-
        * `lead` - lead
        * `analyst` - analyst
        * `experiment` - experiment
        * `finance` - finance
        * `control` - control
    CampaignResult:
      type: object
      properties:
        rank:
          type: integer
        parameters:
          type: object
          additionalProperties: {}
        explanation:
          type: string
          nullable: true
        metrics:
          type: object
          additionalProperties: {}
      required:
      - explanation
      - metrics
      - parameters
      - rank
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Dataset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        checksum:
          type: string
          maxLength: 64
        customer_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        summary:
          allOf:
          - $ref: '#/components/schemas/DatasetSummary'
          readOnly: true
        imported_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - checksum
      - customer_count
      - id
      - imported_at
      - name
      - summary
    DatasetSummary:
      type: object
      properties:
        baseline_arpu:
          type: string
          nullable: true
        tariff_count:
          type: integer
        synthetic:
          type: boolean
          nullable: true
        segments:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        source_kind:
          $ref: '#/components/schemas/SourceKindEnum'
        file_rows:
          type: object
          additionalProperties:
            type: integer
        format:
          $ref: '#/components/schemas/FormatEnum'
        missing_current_tariff:
          type: integer
      required:
      - baseline_arpu
      - segments
      - synthetic
      - tariff_count
    DatasetUpload:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
            format: binary
          maxItems: 4
          minItems: 4
      required:
      - files
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties: {}
      required:
      - code
      - fields
      - message
    FormatEnum:
      enum:
      - raw_csv
      type: string
      description: '* `raw_csv` - raw_csv'
    Health:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
      required:
      - service
      - status
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 512
      required:
      - password
      - username
    Meta:
      type: object
      properties:
        limits:
          type: object
          additionalProperties:
            type: integer
        channel_costs:
          type: object
          additionalProperties:
            type: integer
        features:
          $ref: '#/components/schemas/MetaFeatures'
        environment:
          type: object
          additionalProperties:
            type: string
      required:
      - channel_costs
      - environment
      - features
      - limits
    MetaFeatures:
      type: object
      properties:
        run_execution:
          type: boolean
        openai_strategy:
          type: boolean
        csv_export:
          type: boolean
      required:
      - csv_export
      - openai_strategy
      - run_execution
    PaginatedRunList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Run'
    Readiness:
      type: object
      properties:
        status:
          type: string
        database:
          type: boolean
        broker:
          type: boolean
      required:
      - broker
      - database
      - status
    ResultTotals:
      type: object
      properties:
        pilot_cost:
          type: string
        campaign_cost:
          type: string
          nullable: true
        total_cost:
          type: string
          nullable: true
        pilot_contacts:
          type: integer
        total_contacts:
          type: integer
          nullable: true
        predicted_effect:
          nullable: true
        simulator_result:
          nullable: true
      required:
      - campaign_cost
      - pilot_contacts
      - pilot_cost
      - predicted_effect
      - simulator_result
      - total_contacts
      - total_cost
    Run:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        dataset_id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RunStatusEnum'
          readOnly: true
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '100000.00'
        max_contacts:
          type: integer
          maximum: 15000
          minimum: 1
          default: 15000
        max_pilots:
          type: integer
          maximum: 20
          minimum: 1
          default: 20
        seed:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 42
        strategy:
          allOf:
          - $ref: '#/components/schemas/StrategyEnum'
          default: baseline
        created_at:
          type: string
          format: date-time
          readOnly: true
        progress:
          allOf:
          - $ref: '#/components/schemas/RunProgress'
          readOnly: true
        error:
          allOf:
          - $ref: '#/components/schemas/RunFailure'
          nullable: true
          readOnly: true
        cancellation_requested:
          type: boolean
          readOnly: true
        execution_blocker:
          type: string
          nullable: true
          readOnly: true
      required:
      - cancellation_requested
      - created_at
      - dataset_id
      - error
      - execution_blocker
      - id
      - name
      - progress
      - status
    RunEvent:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        payload: {}
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - id
      - kind
      - payload
    RunEventPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        next_after:
          type: integer
        has_more:
          type: boolean
      required:
      - has_more
      - next_after
      - results
    RunFailure:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    RunProgress:
      type: object
      properties:
        stage:
          type: string
        percent:
          type: integer
          maximum: 100
          minimum: 0
        spent_budget:
          type: string
          nullable: true
        used_contacts:
          type: integer
          nullable: true
        completed_pilots:
          type: integer
      required:
      - completed_pilots
      - percent
      - spent_budget
      - stage
      - used_contacts
    RunResult:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunResultStatusEnum'
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/CampaignResult'
        totals:
          $ref: '#/components/schemas/ResultTotals'
        warnings:
          type: array
          items:
            type: string
      required:
      - campaigns
      - run_id
      - status
      - totals
      - warnings
    RunResultStatusEnum:
      enum:
      - completed
      type: string
      description: '* `completed` - completed'
    RunStatusEnum:
      enum:
      - draft
      - queued
      - running
      - completed
      - failed
      - cancelled
      type: string
      description: |-
        * `draft` - Черновик
        * `queued` - В очереди
        * `running` - Выполняется
        * `completed` - Завершён
        * `failed` - Ошибка
        * `cancelled` - Отменён
    Session:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          nullable: true
        csrf_token:
          type: string
      required:
      - authenticated
      - user
    SourceKindEnum:
      enum:
      - demo
      - upload
      type: string
      description: |-
        * `demo` - demo
        * `upload` - upload
    StrategyEnum:
      enum:
      - baseline
      - openai
      type: string
      description: |-
        * `baseline` - baseline
        * `openai` - openai
    TeamArtifact:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        type:
          type: string
        title:
          type: string
        data: {}
        evidence_ids:
          type: array
          items:
            oneOf:
            - type: string
            - type: integer
      required:
      - data
      - evidence_ids
      - id
      - task_id
      - title
      - type
    TeamCommandRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        snapshot_id:
          type: string
          format: uuid
        parameters:
          type: object
          additionalProperties: {}
      required:
      - parameters
      - snapshot_id
      - type
    TeamCommandResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          $ref: '#/components/schemas/TeamCommandResponseStatusEnum'
        result:
          nullable: true
        error:
          nullable: true
      required:
      - error
      - id
      - result
      - status
      - type
    TeamCommandResponseStatusEnum:
      enum:
      - queued
      - running
      - completed
      - failed
      type: string
      description: |-
        * `queued` - queued
        * `running` - running
        * `completed` - completed
        * `failed` - failed
    TeamSnapshot:
      type: object
      properties:
        schema_version:
          type: integer
        run_id:
          type: string
          format: uuid
        snapshot_id:
          type: string
          format: uuid
        last_event_id:
          type: integer
          minimum: 0
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TeamTask'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/TeamArtifact'
        available_commands:
          type: array
          items:
            type: string
      required:
      - artifacts
      - available_commands
      - last_event_id
      - run_id
      - schema_version
      - snapshot_id
      - tasks
    TeamTask:
      type: object
      properties:
        id:
          type: string
        actor_id:
          $ref: '#/components/schemas/ActorIdEnum'
        status:
          $ref: '#/components/schemas/TeamTaskStatusEnum'
        title:
          type: string
        artifact_ids:
          type: array
          items:
            type: string
        evidence_ids:
          type: array
          items:
            oneOf:
            - type: string
            - type: integer
      required:
      - actor_id
      - artifact_ids
      - evidence_ids
      - id
      - status
      - title
    TeamTaskStatusEnum:
      enum:
      - pending
      - running
      - completed
      - failed
      - cancelled
      type: string
      description: |-
        * `pending` - pending
        * `running` - running
        * `completed` - completed
        * `failed` - failed
        * `cancelled` - cancelled
    TypeEnum:
      enum:
      - explain
      - compare
      - create_plan
      type: string
      description: |-
        * `explain` - explain
        * `compare` - compare
        * `create_plan` - create_plan
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        is_staff:
          type: boolean
      required:
      - id
      - is_staff
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
